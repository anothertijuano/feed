name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gtk4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libsoup-3.0-dev libjson-glib-dev meson ninja-build

      - name: Configure
        run: meson setup build
        working-directory: clients/gtk4

      - name: Build
        run: ninja -C build
        working-directory: clients/gtk4

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          go test ./...
          cd clients/tui && go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o feed-linux-amd64  .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o feed-darwin-amd64 .
          cd clients/tui
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../feedtui-linux-amd64   .
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../feedtui-linux-arm64   .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../feedtui-darwin-amd64  .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../feedtui-darwin-arm64  .
          cd ..
          sha256sum feed-linux-amd64 feed-darwin-amd64 feedtui-linux-amd64 feedtui-linux-arm64 feedtui-darwin-amd64 feedtui-darwin-arm64 > SHA256SUMS
          ls -lh feed-linux-amd64 feed-darwin-amd64 feedtui-* SHA256SUMS

      - name: Stable release (version tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            feed-linux-amd64
            feed-darwin-amd64
            feedtui-linux-amd64
            feedtui-linux-arm64
            feedtui-darwin-amd64
            feedtui-darwin-arm64
            SHA256SUMS
          generate_release_notes: true

      - name: Rolling pre-release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pre --yes --cleanup-tag 2>/dev/null || true
          gh release create pre \
            --prerelease \
            --title "pre — latest main" \
            --notes "Automatic build of the latest main. Use versioned releases for production." \
            feed-linux-amd64 feed-darwin-amd64 \
            feedtui-linux-amd64 feedtui-linux-arm64 feedtui-darwin-amd64 feedtui-darwin-arm64 \
            SHA256SUMS
